name: Test Elise Rust

on:
  push:
    branches: ["**"]
    paths:
      - "rust/elise/**"
      - "scripts/elise.sh"
      - "scripts/package-elise.sh"
      - "scripts/test-elise.sh"
      - ".github/workflows/elise.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "rust/elise/**"
      - "scripts/elise.sh"
      - "scripts/package-elise.sh"
      - "scripts/test-elise.sh"
      - ".github/workflows/elise.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/elise
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features
      - run: cargo test --locked --all
