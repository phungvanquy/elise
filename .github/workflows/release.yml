name: Release Elise

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/test.yml
  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Cargo version and release tag differ'
          PY
      - run: cargo install cross --locked --version 0.2.5
      - run: cross build --locked --release --target ${{ matrix.target }}
      - run: bash scripts/package-elise.sh target/${{ matrix.target }}/release/elise ${{ matrix.arch }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: elise-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "Elise $RELEASE_TAG" \
            --notes-file ".github/release-notes/$RELEASE_TAG.md"
