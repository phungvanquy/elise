name: Test Elise

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features
      - run: cargo test --locked --all
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/interop/hysteria2/go.mod
          cache-dependency-path: tests/interop/hysteria2/go.sum
      - name: Check interoperability module
        working-directory: tests/interop/hysteria2
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Hysteria 2 interoperability
        run: cargo test --locked --test hysteria2_interop -- --ignored --nocapture
      - name: Patched QUIC regression tests
        run: cargo test --locked --manifest-path vendor/quinn-proto/Cargo.toml
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax and ShellCheck
        run: |
          for script in install.sh uninstall.sh scripts/*.sh; do bash -n "$script"; done
          shellcheck --severity=error install.sh uninstall.sh scripts/*.sh
      - run: bash scripts/test-elise.sh
      - run: python3 scripts/test-deploy.py
